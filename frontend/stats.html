<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>受付状況モニター</title>
<link rel="stylesheet" href="css/style.css">
<style>
body{min-height:100vh;display:flex;flex-direction:column;background:#080c14}
#header{display:flex;align-items:center;justify-content:space-between;
  padding:.6rem 1.2rem;background:#0a0f1c;border-bottom:1px solid var(--border);flex-shrink:0}
#header h1{font-size:1rem;font-weight:700}
.clock{font-family:var(--font-mono);font-size:1.2rem;font-weight:700;letter-spacing:.05em}
.poll-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);transition:background .3s}
.poll-dot.active{background:var(--success)}

#login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:1rem}
.login-box{width:100%;max-width:340px;display:flex;flex-direction:column;gap:1rem}

#stats-body{flex:1;overflow-y:auto;padding:1rem;display:none;flex-direction:column;gap:.75rem}

/* サマリーバー */
#summary-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:.5rem;margin-bottom:.5rem}
.sum-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);
  padding:.55rem .7rem;text-align:center}
.sum-card .num{font-size:1.5rem;font-weight:800;font-family:var(--font-mono);line-height:1.1}
.sum-card .lbl{font-size:.68rem;color:var(--text2);margin-top:.15rem}

/* 時間帯カード */
.slot-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);
  overflow:hidden;transition:border-color .3s}
.slot-card.calling         {border-left:4px solid #ffa657}
.slot-card.in_progress     {border-left:4px solid var(--success)}
.slot-card.reservation_open{border-left:4px solid var(--accent)}
.slot-card.expiration_pending{border-left:4px solid var(--warning)}
.slot-card.expired         {border-left:4px solid var(--text3);opacity:.5}
.slot-header{display:flex;align-items:center;justify-content:space-between;
  padding:.65rem 1rem;border-bottom:1px solid var(--border)}
.slot-time{font-family:var(--font-mono);font-size:1rem;font-weight:700}
.slot-body{display:grid;grid-template-columns:repeat(3,1fr);border-top:none}
.stat-col{padding:.6rem .9rem;border-right:1px solid var(--border)}
.stat-col:last-child{border-right:none}
.stat-col .sv{font-size:1.35rem;font-weight:800;font-family:var(--font-mono);line-height:1}
.stat-col .sl{font-size:.7rem;color:var(--text2);margin-top:.1rem}
.bar-wrap{padding:.5rem 1rem .75rem;border-top:1px solid var(--border)}
.bar-bg{background:var(--bg3);border-radius:4px;height:8px;overflow:hidden}
.bar-fill{background:var(--accent);height:100%;border-radius:4px;transition:width .4s ease}

.status-badge{font-size:.72rem;font-weight:700;padding:.18rem .55rem;border-radius:999px}
.sb-calling{background:rgba(255,166,87,.15);color:#ffa657}
.sb-in_progress{background:rgba(63,185,80,.15);color:var(--success)}
.sb-reservation_open{background:rgba(88,166,255,.15);color:var(--accent)}
.sb-expiration_pending{background:rgba(210,153,34,.15);color:var(--warning)}
.sb-expired{background:var(--bg3);color:var(--text3)}
</style>
</head>
<body>

<div id="header">
  <h1>📊 受付状況モニター</h1>
  <div class="clock" id="clock">--:--:--</div>
  <div style="display:flex;align-items:center;gap:.6rem;font-size:.78rem;color:var(--text2)">
    <div class="poll-dot" id="poll-dot"></div>
    <span id="poll-status">待機中</span>
  </div>
</div>

<div id="login-wrap">
  <div class="login-box">
    <div style="text-align:center;font-size:2rem">📊</div>
    <h2 style="text-align:center;font-size:1.2rem">受付状況モニター</h2>
    <div class="field"><label>ユーザー名</label><input id="s-user"></div>
    <div class="field"><label>パスワード</label><input id="s-pass" type="password"></div>
    <button class="btn btn-primary btn-lg w-full" id="btn-login">ログイン</button>
    <p id="login-err" class="text-danger text-center" style="font-size:.85rem;min-height:1.2em"></p>
  </div>
</div>

<div id="stats-body">
  <div id="summary-bar"></div>
  <div id="slot-list"></div>
</div>

<div id="toast-container"></div>
<script type="module">
import { api, toast, saveToken } from './js/api.js';

let sheetId = null, pollTimer = null;

// 時計
setInterval(() => {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('ja-JP', { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12: false });
}, 1000);

document.getElementById('btn-login').onclick = async () => {
  const u = document.getElementById('s-user').value.trim();
  const p = document.getElementById('s-pass').value;
  const errEl = document.getElementById('login-err');
  errEl.textContent = '';
  const btn = document.getElementById('btn-login');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  try {
    const data = await api.login(u, p);
    saveToken(data.token);
    sheetId = data.user.sheetId;
    document.getElementById('login-wrap').style.display = 'none';
    document.getElementById('stats-body').style.display = 'flex';
    fetchAndRender();
    pollTimer = setInterval(fetchAndRender, 15000);
  } catch(e) {
    errEl.textContent = e.code === 'INVALID_CREDENTIALS' ? 'ユーザー名またはパスワードが違います' : e.message;
  } finally { btn.disabled = false; btn.textContent = 'ログイン'; }
};

async function fetchAndRender() {
  const dot = document.getElementById('poll-dot');
  dot.classList.add('active');
  try {
    const data = await api.getStatus(sheetId);
    renderSummary(data.timeSlots);
    renderSlots(data.timeSlots);
    document.getElementById('poll-status').textContent = '接続中';
  } catch(e) {
    document.getElementById('poll-status').textContent = 'エラー: ' + e.message;
  } finally { setTimeout(() => dot.classList.remove('active'), 500); }
}

function renderSummary(slots) {
  const totals = { reserved:0, calling:0, accepted:0, absent:0, expired:0, total:0 };
  slots.forEach(s => {
    totals.reserved += (s.reservedGroups ?? 0);
    totals.accepted += (s.accepted ?? 0);
    totals.absent   += (s.absent ?? 0);
    totals.expired  += (s.expired ?? 0);
  });
  totals.total = slots.reduce((a, s) => a + s.capacityGroups, 0);

  const items = [
    { key:'total',    label:'総定員',   color:'var(--text)',    val: totals.total },
    { key:'reserved', label:'予約済',   color:'var(--accent)',  val: totals.reserved },
    { key:'accepted', label:'受付済',   color:'var(--success)', val: totals.accepted },
    { key:'absent',   label:'不在',     color:'var(--warning)', val: totals.absent },
    { key:'expired',  label:'失効',     color:'var(--danger)',  val: totals.expired },
  ];
  document.getElementById('summary-bar').innerHTML = items.map(i =>
    `<div class="sum-card"><div class="num" style="color:${i.color}">${i.val}</div><div class="lbl">${i.label}</div></div>`
  ).join('');
}

function renderSlots(slots) {
  const list = document.getElementById('slot-list');
  list.innerHTML = slots.map(s => {
    const pct = s.capacityGroups > 0 ? Math.round(s.reservedGroups / s.capacityGroups * 100) : 0;
    const label = statusLabel(s.status);
    return `
    <div class="slot-card ${s.status}">
      <div class="slot-header">
        <span class="slot-time">${fmt(s.startAt)} 〜 ${fmt(s.endAt)}</span>
        <span class="status-badge sb-${s.status}">${label}${s.isRecovery?' (救済呼出中)':''}</span>
      </div>
      <div class="slot-body">
        <div class="stat-col"><div class="sv">${s.reservedGroups}</div><div class="sl">予約 / ${s.capacityGroups}組</div></div>
        <div class="stat-col"><div class="sv">${s.accepted}</div><div class="sl">受付済</div></div>
        <div class="stat-col"><div class="sv">${s.absent} / ${s.expired}</div><div class="sl">不在 / 失効</div></div>
      </div>
      <div class="bar-wrap">
        <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
      </div>
    </div>`;
  }).join('');
}

function fmt(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleTimeString('ja-JP', { hour:'2-digit', minute:'2-digit', hour12: false });
}

function statusLabel(s) {
  return { reservation_open:'予約受付中', before_call:'呼出前', calling:'呼出中',
    in_progress:'進行中', expiration_pending:'失効待ち', expired:'失効済' }[s] ?? s;
}
</script>
</body>
</html>
