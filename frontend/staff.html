<script type="module">
import {
  api,
  toast,
  genKey,
  saveToken,
  clearToken,
  getToken
} from './js/api.js';

let sheetId = null;
let activeQueue = null;
let currentRes = null;
let pollTimer = null;

// ============================================================
// ログイン
// ============================================================
document.getElementById('btn-login').onclick = async () => {
  const username = document
    .getElementById('login-user')
    .value
    .trim();

  const password = document
    .getElementById('login-pass')
    .value;

  const errorEl =
    document.getElementById('login-error');

  errorEl.textContent = '';

  if (!username || !password) {
    errorEl.textContent =
      'ユーザー名とパスワードを入力してください';
    return;
  }

  const btn =
    document.getElementById('btn-login');

  btn.disabled = true;
  btn.innerHTML =
    '<span class="spinner"></span>';

  try {
    const data =
      await api.login(username, password);

    // トークン保存
    saveToken(data.token);

    // スタッフアカウントに紐付いたシート
    sheetId = data.user?.sheetId ?? null;

    if (!sheetId) {
      throw new Error(
        'このスタッフアカウントにはシートが設定されていません'
      );
    }

    document
      .getElementById('header-sheet')
      .textContent = `シート ${sheetId}`;

    showMain();

  } catch (e) {
    errorEl.textContent =
      e.code === 'INVALID_CREDENTIALS'
        ? 'ユーザー名またはパスワードが違います'
        : (e.message || 'ログインに失敗しました');

  } finally {
    btn.disabled = false;
    btn.textContent = 'ログイン';
  }
};

// Enterキーでログイン
document
  .getElementById('login-pass')
  .addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      document
        .getElementById('btn-login')
        .click();
    }
  });


// ============================================================
// メイン画面表示
// ============================================================
function showMain() {
  document.getElementById('login-screen').style.display =
    'none';

  document.getElementById('header').style.display =
    'flex';

  document.getElementById('main').style.display =
    'flex';

  fetchAndRender();

  clearInterval(pollTimer);

  pollTimer =
    setInterval(fetchAndRender, 8000);
}


// ============================================================
// ログアウト
// ============================================================
document
  .getElementById('btn-logout')
  .onclick = async () => {

    clearInterval(pollTimer);

    try {
      await api.logout();
    } catch (_) {}

    clearToken();

    location.reload();
  };


// ============================================================
// ポーリング
// ============================================================
async function fetchAndRender() {
  if (!sheetId) return;

  const dot =
    document.getElementById('poll-dot');

  dot.classList.add('active');

  try {
    const data =
      await api.getOverview(sheetId);

    renderOverview(data);

    document
      .getElementById('poll-status')
      .textContent = '接続中';

  } catch (e) {
    console.error(e);

    document
      .getElementById('poll-status')
      .textContent = 'エラー';

  } finally {
    setTimeout(
      () => dot.classList.remove('active'),
      500
    );
  }
}


// ============================================================
// スタッフ画面描画
// ============================================================
function renderOverview(data) {
  const cur = data.current;

  // ----------------------------------------------------------
  // アクティブキュー
  // ----------------------------------------------------------
  const activeSlotSummary =
    data.activeTimeSlot
      ? data.timeSlots.find(
          s => s.id === data.activeTimeSlot.id
        )
      : null;

  activeQueue =
    activeSlotSummary?.queue
      ? {
          queueId:
            activeSlotSummary.queue.id
        }
      : null;

  currentRes = cur;

  // ----------------------------------------------------------
  // 時間帯
  // ----------------------------------------------------------
  document
    .getElementById('slot-label')
    .textContent =
      data.activeTimeSlot
        ? `${data.activeTimeSlot.name} 【${statusLabel(data.activeTimeSlot.status)}】`
        : '待機中';


  // ----------------------------------------------------------
  // 中央の番号
  //
  // 現在呼出中があれば current
  // なければ next[0] を表示
  // ----------------------------------------------------------
  const nextTicket =
    data.next?.[0] ?? null;

  const displayTicket =
    cur?.ticketCode ??
    nextTicket?.ticketCode ??
    '—';

  document
    .getElementById('current-ticket')
    .textContent = displayTicket;


  // ----------------------------------------------------------
  // 中央の補足表示
  // ----------------------------------------------------------
  document
    .getElementById('current-meta')
    .textContent =
      cur
        ? `${cur.groupSize} 名`
        : nextTicket
          ? '次に呼び出す番号'
          : '';


  // ----------------------------------------------------------
  // 受付
  // ----------------------------------------------------------
  document
    .getElementById('btn-accept')
    .disabled =
      !data.canAccept || !cur;


  // ----------------------------------------------------------
  // 次へ
  //
  // 現在呼出中あり
  //   → 不在にして次を呼ぶ
  //
  // 現在呼出中なし
  //   → 最初の待機番号を呼ぶ
  // ----------------------------------------------------------
  document
    .getElementById('btn-next')
    .disabled =
      !data.canNext;


  // ----------------------------------------------------------
  // キャンセル
  // ----------------------------------------------------------
  document
    .getElementById('btn-cancel')
    .disabled =
      !cur;


  // ----------------------------------------------------------
  // 次候補
  // ----------------------------------------------------------
  const labels = [
    '次',
    '次々',
    '次々次'
  ];

  document
    .getElementById('next-list')
    .innerHTML =
      (data.next ?? [])
        .map((t, i) => `
          <div class="next-row">
            <span class="next-label">
              ${labels[i] ?? ''}
            </span>

            <span class="next-code">
              ${t.ticketCode ?? '—'}
            </span>
          </div>
        `)
        .join('');


  // ----------------------------------------------------------
  // 不在一覧
  // ----------------------------------------------------------
  const absentPanel =
    document.getElementById(
      'absent-panel'
    );

  if (data.absent?.length) {
    absentPanel.style.display = '';

    document
      .getElementById('absent-chips')
      .innerHTML =
        data.absent
          .map(a => `
            <span class="absent-chip">
              ${a.ticketCode}
            </span>
          `)
          .join('');

  } else {
    absentPanel.style.display =
      'none';
  }


  // ----------------------------------------------------------
  // 他時間帯
  // ----------------------------------------------------------
  document
    .getElementById('slots-list')
    .innerHTML =
      (data.timeSlots ?? [])
        .map(s => `
          <div class="slot-row">
            <span>
              ${s.name}

              <span class="badge badge-${s.status}">
                ${statusLabel(s.status)}
              </span>
            </span>

            <span class="text-muted">
              ${s.reservedGroups}/${s.capacityGroups} 組
            </span>
          </div>
        `)
        .join('');
}


// ============================================================
// 受付ボタン
// ============================================================
document
  .getElementById('btn-accept')
  .onclick = async () => {

    if (!currentRes) return;

    document
      .getElementById('confirm-detail')
      .innerHTML = `
        <p>
          <strong>整理番号:</strong>
          ${currentRes.ticketCode}
        </p>

        <p>
          <strong>人数:</strong>
          ${currentRes.groupSize} 名
        </p>
      `;

    document
      .getElementById('confirm-modal')
      .style.display = 'flex';

    document
      .getElementById('btn-do-accept')
      .onclick = async () => {

        const btn =
          document.getElementById(
            'btn-do-accept'
          );

        btn.disabled = true;

        btn.innerHTML =
          '<span class="spinner"></span>';

        try {
          await api.acceptReservation(
            currentRes.reservationId,
            genKey()
          );

          closeConfirm();

          toast(
            '受付しました',
            'success'
          );

          await fetchAndRender();

        } catch (e) {
          toast(
            e.message,
            'error'
          );

        } finally {
          btn.disabled = false;
          btn.textContent =
            '受付する';
        }
      };
  };


window.closeConfirm = () => {
  document
    .getElementById('confirm-modal')
    .style.display = 'none';
};


// ============================================================
// 次へボタン
// ============================================================
document
  .getElementById('btn-next')
  .onclick = async () => {

    const queueId =
      getActiveQueueId();

    if (!queueId) {
      toast(
        '対象のキューがありません',
        'error'
      );
      return;
    }

    const btn =
      document.getElementById(
        'btn-next'
      );

    btn.disabled = true;

    try {

      // ------------------------------------------------------
      // 現在呼出中がある
      // → 不在扱いにして次へ
      // ------------------------------------------------------
      if (currentRes) {

        await api.markAbsentAndNext(
          queueId,
          genKey()
        );

        toast(
          '不在処理して次を呼び出しました',
          'info'
        );

      }

      // ------------------------------------------------------
      // 現在呼出中がない
      // → 最初の待機番号を呼び出す
      // ------------------------------------------------------
      else {

        await api.callNext(
          queueId,
          genKey()
        );

        toast(
          '次の番号を呼び出しました',
          'info'
        );
      }

      await fetchAndRender();

    } catch (e) {

      console.error(e);

      toast(
        e.message,
        'error'
      );

    } finally {
      btn.disabled = false;
    }
  };


// ============================================================
// キャンセルボタン
// ============================================================
document
  .getElementById('btn-cancel')
  .onclick = async () => {

    if (!currentRes) return;

    const confirmed =
      confirm(
        `${currentRes.ticketCode} をキャンセルしますか？`
      );

    if (!confirmed) return;

    try {

      await api.cancelStaff(
        currentRes.reservationId,
        genKey()
      );

      toast(
        'キャンセルしました',
        'success'
      );

      await fetchAndRender();

    } catch (e) {
      toast(
        e.message,
        'error'
      );
    }
  };


// ============================================================
// 検索
// ============================================================
document
  .getElementById('btn-search-open')
  .onclick = () => {

    document
      .getElementById('search-modal')
      .classList.add('open');

    document
      .getElementById('search-input')
      .focus();
  };


window.closeSearch = () => {
  document
    .getElementById('search-modal')
    .classList.remove('open');

  document
    .getElementById('search-result')
    .innerHTML = '';

  document
    .getElementById('search-input')
    .value = '';
};


document
  .getElementById('btn-search')
  .onclick = async () => {

    const q =
      document
        .getElementById('search-input')
        .value
        .trim();

    if (!q) return;

    try {

      const data =
        await api.searchReservations(
          sheetId,
          q
        );

      renderSearchResults(
        data.results
      );

    } catch (e) {
      toast(
        e.message,
        'error'
      );
    }
  };


function renderSearchResults(results) {
  const el =
    document.getElementById(
      'search-result'
    );

  if (!results.length) {
    el.innerHTML =
      '<p class="text-muted">見つかりませんでした</p>';
    return;
  }

  el.innerHTML =
    results
      .map(r => `
        <div class="result-card">

          <div
            style="font-family:var(--font-mono);font-weight:700"
          >
            ${r.ticketCode}
          </div>

          <div class="text-muted">
            ${r.timeSlot.name}
            /
            ${r.groupSize}名
            /
            <span class="badge badge-${r.status}">
              ${r.status}
            </span>
          </div>

          <div class="result-actions">

            ${
              r.status === 'reserved' ||
              r.status === 'absent'
                ? `
                  <button
                    class="btn btn-sm btn-primary"
                    onclick="doEmergencyCall(${r.id})"
                  >
                    即時呼出
                  </button>
                `
                : ''
            }

            <button
              class="btn btn-sm btn-danger"
              onclick="doCancel(${r.id}, '${r.ticketCode}')"
            >
              即時キャンセル
            </button>

          </div>
        </div>
      `)
      .join('');
}


// ============================================================
// 即時呼出
// ============================================================
window.doEmergencyCall = async (id) => {

  try {

    await api.emergencyCall(
      id,
      genKey()
    );

    toast(
      '即時呼出しました',
      'success'
    );

    closeSearch();

    await fetchAndRender();

  } catch (e) {

    toast(
      e.message,
      'error'
    );
  }
};


// ============================================================
// 即時キャンセル
// ============================================================
window.doCancel = async (
  id,
  code
) => {

  if (
    !confirm(
      `${code} を即時キャンセルしますか？`
    )
  ) {
    return;
  }

  try {

    await api.cancelStaff(
      id,
      genKey()
    );

    toast(
      'キャンセルしました',
      'success'
    );

    closeSearch();

    await fetchAndRender();

  } catch (e) {

    toast(
      e.message,
      'error'
    );
  }
};


// ============================================================
// 現在のキューID
// ============================================================
function getActiveQueueId() {
  return activeQueue?.queueId ?? null;
}


// ============================================================
// ステータス表示名
// ============================================================
function statusLabel(s) {
  return {
    reservation_open: '予約受付中',
    before_call: '呼出前',
    calling: '呼出中',
    in_progress: '進行中',
    expiration_pending: '失効待ち',
    expired: '失効済'
  }[s] ?? s;
}


// ============================================================
// 既存トークン
// ============================================================
if (getToken()) {
  // 自動復元は現状行わない。
  // sheetId はログイン時にユーザー情報から取得する。
}
</script>
